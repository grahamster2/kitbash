[package]
name = "kitbash-app"
version = "0.1.0"
description = "Kitbash desktop viewport"
authors = ["Kitbash"]
edition = "2021"

[lib]
name = "kitbash_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than native-tls: no OpenSSL build dependency, and the server is
# usually reached over a tailnet by IP anyway.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
